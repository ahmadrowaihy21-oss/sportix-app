name: Integration tools
on:
  push:
    branches: ['codex/integration-tools']
    paths: ['tools/integration-lab/**', '.github/workflows/integration-tools.yml', 'sportix-integration.code-workspace']
  pull_request:
    paths: ['tools/integration-lab/**', '.github/workflows/integration-tools.yml', 'sportix-integration.code-workspace']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postman-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/integration-lab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/integration-lab/package-lock.json
      - run: npm ci --no-fund
      - run: npm test
