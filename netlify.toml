[build]
  command = "npm run build:netlify"
  publish = "dist"
  functions = ".netlify/functions-internal"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY = "true"

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/media/*"
  to = "/media/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
